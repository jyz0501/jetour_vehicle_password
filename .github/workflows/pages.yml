name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Update version
        run: |
          chmod +x ./update_version.sh
          ./update_version.sh

      # 前端不再内置任何密钥：只注入接口地址，运行时向 /api/ticket 申请短期票据
      - name: 生成接口配置
        run: |
          cat > config.local.js <<EOF
          window.__JTGJ_PW_CFG__ = {
            API_BASE_URL: 'https://api.qianxian.tech'
          };
          EOF

      # 只发布前端资源：避免把 Python 源码 / 后台配置 / 小程序工程一并公开
      # 注意：admin.html（验证开关后台）不再随站发布——页面里的接口密钥与
      # /api/admin/verify 入口会对所有访客可见，需要改配置请在本地打开使用。
      - name: 组装发布目录
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          for f in index.html style.css app.js icon.png config.local.js; do
            cp "$f" _site/
          done
          cp -r utils config assets _site/
          find _site -name '.DS_Store' -delete
          echo "--- 发布内容 ---"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
