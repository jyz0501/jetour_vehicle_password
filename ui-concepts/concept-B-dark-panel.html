<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念稿 B · 深色工程面板（车型分组栏 + 状态口令卡）</title>
<style>
  /* ===== 概念稿 B：桌面宽 · 深色 · 工程仪表风格 ===== */
  :root{
    --bg0:#0d1117; --bg1:#111827; --panel:#161e2b; --panel2:#1c2735;
    --line:#273445; --txt:#e6edf3; --sub:#8b9bb0;
    --accent:#22d3ee; --accent2:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 500px at 80% -10%,#16233a 0%,var(--bg0) 55%);
       color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
  .app{max-width:1180px;margin:0 auto;padding:22px 20px 60px;display:grid;
       grid-template-columns:380px 1fr;gap:22px;align-items:start;}
  @media(max-width:900px){.app{grid-template-columns:1fr}}

  /* ===== 左栏：车型选择 ===== */
  .side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
       position:sticky;top:18px;max-height:calc(100vh-40px);overflow:auto;}
  .side h1{font-size:18px;display:flex;align-items:center;gap:10px;letter-spacing:.5px;}
  .side h1 .sq{width:9px;height:18px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px;}
  .side .sub{color:var(--sub);font-size:12px;margin:6px 0 14px;}
  .search{margin-bottom:12px;position:relative;}
  .search input{width:100%;background:var(--bg0);border:1px solid var(--line);border-radius:10px;
      color:var(--txt);padding:9px 12px 9px 34px;font-size:13px;outline:none;}
  .search input:focus{border-color:var(--accent);}
  .search svg{position:absolute;left:11px;top:10px;opacity:.5;}
  .grp{margin:12px 0 4px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--sub);}
  .opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;
       border:1px solid transparent;margin-bottom:2px;transition:.14s;}
  .opt:hover{background:var(--panel2);}
  .opt.on{background:linear-gradient(90deg,rgba(34,211,238,.12),transparent);border-color:rgba(34,211,238,.35);}
  .opt .radio{width:15px;height:15px;border-radius:50%;border:2px solid #3d4d63;flex:none;
      display:grid;place-items:center;}
  .opt.on .radio{border-color:var(--accent);}
  .opt.on .radio::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);}
  .opt .nm{flex:1;font-size:13.5px;}
  .opt .dt{font-size:11px;color:var(--sub);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.hourly{background:var(--accent2);box-shadow:0 0 8px var(--accent2);}
  .dot.fixed{background:#64748b;}

  /* ===== 右栏：结果区 ===== */
  .main{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .cur-bar{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);
       flex-wrap:wrap;}
  .cur-bar .car{font-size:20px;font-weight:800;}
  .cur-bar .mode{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid;
       font-weight:600;}
  .mode.hourly{color:var(--accent2);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.08);}
  .mode.fixed{color:var(--sub);border-color:var(--line);}
  .cur-bar .refresh{color:var(--sub);font-size:12px;margin-left:auto;
       font-variant-numeric:tabular-nums;}
  .cur-bar .refresh b{color:var(--warn);}

  /* 版本：分段式 tabs（动态只渲染该车型支持的版本） */
  .ver-block{margin:16px 0 18px;}
  .ver-block .lab{font-size:11px;letter-spacing:1px;color:var(--sub);margin-bottom:8px;}
  .ver-tabs{display:inline-flex;background:var(--bg0);border:1px solid var(--line);border-radius:12px;
       padding:4px;gap:4px;flex-wrap:wrap;}
  .ver-tab{padding:8px 16px;border-radius:8px;border:none;background:transparent;color:var(--sub);
       font-size:13px;cursor:pointer;transition:.15s;font-family:inherit;}
  .ver-tab:hover{color:var(--txt);}
  .ver-tab.on{background:linear-gradient(180deg,#243447,#1a2736);color:var(--accent);
       box-shadow:0 2px 10px rgba(34,211,238,.15);font-weight:700;}
  .ver-tab .rec-tag{font-size:9px;color:#0d1117;background:var(--accent);border-radius:6px;
       padding:1px 5px;margin-left:5px;vertical-align:1px;font-weight:800;}

  /* 口令卡网格 */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.cards{grid-template-columns:1fr}}
  .pcard{background:var(--bg0);border:1px solid var(--line);border-radius:14px;padding:16px;
       position:relative;overflow:hidden;}
  .pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
       background:linear-gradient(180deg,var(--accent),var(--accent2));opacity:.85;}
  .pcard .tag2{font-size:10px;color:var(--accent);letter-spacing:2px;font-weight:700;}
  .pcard h3{font-size:15px;margin:6px 0 4px;}
  .pcard .desc{font-size:12px;color:var(--sub);}
  .pwd-row{display:flex;align-items:center;gap:8px;margin:16px 0 4px;
       background:var(--panel2);border:1px dashed #33445c;border-radius:10px;padding:8px 12px;}
  .pwd-row .code{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:5px;flex:1;
       font-variant-numeric:tabular-nums;}
  .icon-btn{width:34px;height:34px;border-radius:8px;background:var(--panel);border:1px solid var(--line);
       color:var(--accent);cursor:pointer;display:grid;place-items:center;transition:.15s;}
  .icon-btn:hover{background:#243447;color:#fff;}
  .locked{filter:grayscale(1);opacity:.5;pointer-events:none;}
  .pcard .warn-line{margin-top:10px;font-size:12px;color:var(--warn);background:rgba(251,191,36,.08);
       border:1px solid rgba(251,191,36,.25);padding:7px 10px;border-radius:8px;display:none;}
  .pcard .warn-line.show{display:block;}

  /* 有效性倒计时进度环用底部细条示意 */
  .lifetime{margin:16px 2px 2px;display:flex;align-items:center;gap:10px;}
  .lifetime .ring{width:42px;height:42px;flex:none;}
  .lifetime .txt{font-size:12px;color:var(--sub);}
  .lifetime .txt b{display:block;font-size:20px;color:var(--accent2);
       font-variant-numeric:tabular-nums;}
  .lifetime .txt b.warn{color:var(--warn);}
  .foot-note{margin-top:18px;color:var(--sub);font-size:11.5px;border-top:1px dashed var(--line);
       padding-top:12px;line-height:1.8;}
</style>
</head>
<body>
<div class="app">
  <!-- 左栏：分组 + 搜索 -->
  <aside class="side">
    <h1><span class="sq"></span>车机口令控制台</h1>
    <div class="sub">选择车型 → 系统自动匹配口令算法</div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b9bb0"><circle cx="11" cy="11" r="7" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke-width="2"/></svg>
      <input id="q" placeholder="搜索车型，如 G700 / L9 / 旅行者…">
    </div>
    <div id="list"></div>
  </aside>

  <!-- 右栏 -->
  <main class="main">
    <div class="cur-bar">
      <div class="car" id="curCar">纵横G700</div>
      <span class="mode hourly" id="modeTag">每小时动态</span>
      <div class="refresh" id="curTime">--:--:--</div>
    </div>

    <div class="ver-block">
      <div class="lab">SYSTEM VERSION · 系统版本</div>
      <div class="ver-tabs" id="verTabs"></div>
    </div>

    <div class="cards">
      <div class="pcard" id="card1">
        <div class="tag2">ENGINEERING MODE</div>
        <h3 id="t1">工程模式口令</h3>
        <div class="desc">蓝牙电话拨号界面进入</div>
        <div class="pwd-row"><span class="code" id="p1">------</span>
          <button class="icon-btn" data-i="0" title="复制">⧉</button></div>
        <div class="warn-line" id="w1"></div>
      </div>
      <div class="pcard" id="card2">
        <div class="tag2">ADB / ENCRYPT</div>
        <h3 id="t2">ADB权限口令</h3>
        <div class="desc">工程模式 → 加密设置</div>
        <div class="pwd-row"><span class="code" id="p2">------</span>
          <button class="icon-btn" data-i="1" title="复制">⧉</button></div>
        <div class="warn-line" id="w2"></div>
      </div>
    </div>

    <div class="lifetime">
      <svg class="ring" id="ring" viewBox="0 0 44 44">
        <circle cx="22" cy="22" r="19" fill="none" stroke="#273445" stroke-width="5"/>
        <circle id="ringArc" cx="22" cy="22" r="19" fill="none" stroke="#34d399" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="0" transform="rotate(-90 22 22)"/>
      </svg>
      <div class="txt">口令剩余有效时间<b id="leftT">59:59</b><span id="modeTxt">每 60 分钟轮换 · 每小时整点刷新</span></div>
    </div>
    <div class="foot-note" id="footNote">输入路径提示会随车型与版本自动变化（示意稿数据，正式接入以后端为准）。</div>
  </main>
</div>

<script>
/* ====== 演示数据 ====== */
const GROUPS=[
  {g:"纵横",list:["g700","zonghengF700"]},
  {g:"捷途",list:["traveler","ziyouzhe","shanhal7","shanhal9","x70plus","x90plus","x95","dasheng"]},
  {g:"奇瑞",list:["fengyunA9","hu8"]}
];
const MODELS={
  g700:{name:"纵横G700",type:"hourly",hint:"纵横G700 · 3.36-3.37",versions:[{v:"330335",n:"3.30-3.35"},{v:"335337",n:"3.36-3.37"},{v:"4.0x-4.4x",n:"4.0x-4.4x",rec:true}]},
  zonghengF700:{name:"纵横F700",type:"hourly",versions:[{v:"000302",n:"00.03.02"}]},
  traveler:{name:"旅行者/山海T2",type:"hourly",versions:[{v:"00x",n:"00.08及以下",note:"序列号"},{v:"0406",n:"4.06及以下"},{v:"0407",n:"4.07以上",rec:true},{v:"other",n:"其他"},{v:"cdm",n:"26款"}]},
  ziyouzhe:{name:"自由者/山海T1",type:"hourly",versions:[{v:"11010x",n:"11.01.04+",rec:true},{v:"01010x",n:"01.01.0x"},{v:"000402",n:"00.04.02"}]},
  shanhal7:{name:"山海L7/Plus",type:"hourly",versions:[{v:"os10201",n:"OS1-02.01"},{v:"os1201000",n:"OS1_20.10.00",rec:true}]},
  shanhal9:{name:"山海L9",type:"fixed",versions:[{v:"unknown",n:"全系"}]},
  x70plus:{name:"X70Plus/L/Pro/CDM",type:"fixed",versions:[{v:"unknown",n:"00.01.0x"}]},
  x90plus:{name:"X90/Plus/Pro/CDM",type:"fixed",versions:[{v:"040x",n:"04.0x"},{v:"unknown",n:"其他",rec:true}]},
  x95:{name:"X95",type:"fixed",versions:[{v:"unknown",n:"全系"}]},
  dasheng:{name:"捷途大圣",type:"fixed",versions:[{v:"fixed",n:"全系"}]},
  fengyunA9:{name:"风云A9/T9",type:"fixed",versions:[{v:"unknown",n:"全系"}]},
  hu8:{name:"虎8/8L",type:"fixed",versions:[{v:"unknown",n:"全系"}]}
};
let cur="g700", curVer=null;
const pwdRow1=document.getElementById("card1"),pwdRow2=document.getElementById("card2");

function renderList(){
  const list=document.getElementById("list"); list.innerHTML="";
  GROUPS.forEach(g=>{
    if(!g.list.some(k=>filterOk(MODELS[k].name))) return;
    const gp=document.createElement("div"); gp.className="grp"; gp.textContent=g.g; list.appendChild(gp);
    g.list.forEach(k=>{
      const m=MODELS[k]; if(!filterOk(m.name)) return;
      const o=document.createElement("div"); o.className="opt"+(cur===k?" on":"");
      o.innerHTML=`<span class="dot ${m.type}"></span><span class="nm">${m.name}</span><span class="dt">${m.type==="hourly"?"动态":"固定"}</span><span class="radio"></span>`;
      o.onclick=()=>{cur=k;curVer=null;renderList();pick();};
      list.appendChild(o);
    });
  });
}
function filterOk(name){ const q=document.getElementById("q").value.trim().toLowerCase();
  return !q || name.toLowerCase().includes(q); }
document.getElementById("q").addEventListener("input",renderList);

function pick(){
  const m=MODELS[cur];
  document.getElementById("curCar").textContent=m.name;
  const tag=document.getElementById("modeTag");
  tag.className="mode "+m.type;
  tag.textContent=m.type==="hourly"?"每小时动态":"固定口令";
  // 版本 tabs
  const bar=document.getElementById("verTabs"); bar.innerHTML="";
  const recIdx=m.versions.findIndex(x=>x.rec);
  curVer=curVer||(recIdx>=0?m.versions[recIdx].v:m.versions[0].v);
  m.versions.forEach(x=>{
    const b=document.createElement("button"); b.className="ver-tab"+(x.v===curVer?" on":"");
    b.innerHTML=x.n+(x.rec?'<span class="rec-tag">推荐</span>':'');
    b.onclick=()=>{curVer=x.v;renderVer();renderCards();};
    bar.appendChild(b);
  });
  if(m.type==="fixed"){ document.getElementById("leftT").textContent="— 固定 —"; }
  renderCards(); startClock();
}
function renderVer(){
  const m=MODELS[cur];
  document.querySelectorAll("#verTabs .ver-tab").forEach((b,i)=>{
    const v=m.versions[i]; b.classList.toggle("on",v.v===curVer);
  });
}
function fakePwd(seed){let s="";for(let i=0;i<6;i++)s+=(seed+i*7)%10;return s;}
function renderCards(){
  const m=MODELS[cur];
  const vi=m.versions.findIndex(x=>x.v===curVer);
  const seed=(cur.length+curVer.length)*3+vi;
  const showAdb=m.type!=="fixed" && !(m.name.includes("山海L7"));
  pwdRow1.classList.remove("locked"); pwdRow2.classList.remove("locked");
  pwdRow2.style.display=showAdb?"":"none";
  document.getElementById("p1").textContent=fakePwd(seed);
  document.getElementById("p2").textContent=fakePwd(seed+5);
  const nm=m.name;
  document.getElementById("t1").textContent="工程模式口令";
  document.getElementById("t2").textContent=(nm.includes("F700")||nm.includes("G700"))?"ADB权限口令":"加密项口令";
  const v=m.versions.find(x=>x.v===curVer);
  const needSerial=v&&v.note==="序列号";
  const w1=document.getElementById("w1"),w2=document.getElementById("w2");
  w1.classList.toggle("show",needSerial); w1.textContent="⚠ 该版本需输入车辆序列号后六位";
  w2.classList.toggle("show",false);
}
let left=59*60+59,timer;
function startClock(){
  const now=new Date();
  const p=document.getElementById("curTime");
  const pad=n=>String(n).padStart(2,"0");
  if(MODELS[cur].type==="hourly"){ p.innerHTML="下次换码 <b>"+pad(now.getMinutes()+1>59?0:now.getMinutes()+1)+":"+pad(now.getSeconds())+"</b>"; 
    document.getElementById("leftT").textContent=pad(Math.floor(left/60))+":"+pad(left%60);
    clearInterval(timer); timer=setInterval(()=>{
      left=Math.max(0,left-1);
      document.getElementById("leftT").textContent=pad(Math.floor(left/60))+":"+pad(left%60);
      const frac=left/(59*60+59);
      const arc=document.getElementById("ringArc");
      arc.setAttribute("stroke-dashoffset",119.4*(1-frac));
    },1000);
  }
}
document.querySelectorAll(".icon-btn").forEach(b=>b.onclick=()=>{
  const t=document.getElementById(b.dataset.i==="0"?"p1":"p2").textContent;
  navigator.clipboard.writeText(t).then(()=>{b.textContent="✓";setTimeout(()=>b.textContent="⧉",1200);});
});
renderList(); pick();
</script>
</body>
</html>
