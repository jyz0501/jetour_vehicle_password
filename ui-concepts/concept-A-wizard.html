<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>概念稿 A · 极简向导式（车型版本一体化）</title>
<style>
  /* ===== 概念稿 A：移动优先 · 浅色 · 引导式 ===== */
  :root{
    --bg:#f3f5fb; --card:#fff; --line:#e6e9f2;
    --txt:#1c2333; --sub:#6b7280; --brand:#5b5bd6; --brand-2:#7c3aed;
    --accent:#f59e0b; --ok:#16a34a; --bad:#e11d48;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#eef0fb 0%,var(--bg) 260px);color:var(--txt);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px;}
  header h1{font-size:20px;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
  header h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--brand-2);
      box-shadow:0 0 0 4px rgba(124,58,237,.15);}
  header p{color:var(--sub);font-size:13px;margin:6px 0 18px;}

  /* 步骤指示 */
  .steps{display:flex;gap:8px;margin:0 0 16px;}
  .step-bar{flex:1;height:5px;border-radius:3px;background:#dfe3f0;}
  .step-bar.on{background:linear-gradient(90deg,var(--brand),var(--brand-2));}
  .step-bar.done{background:var(--brand);}

  .step-head{display:flex;align-items:baseline;gap:8px;margin:14px 0 10px;}
  .step-head b{color:var(--brand-2);font-size:13px;}
  .step-head h2{font-size:16px;}
  .step-head span{font-size:12px;color:var(--sub);}

  /* 车型网格卡片 */
  .car-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .group-tag{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--sub);
      margin:6px 0 -2px;display:flex;align-items:center;gap:8px;}
  .group-tag::after{content:"";flex:1;height:1px;background:var(--line);}
  .car-card{border:1.5px solid var(--line);border-radius:14px;background:var(--card);
      padding:12px 12px 10px;cursor:pointer;transition:.18s;text-align:left;position:relative;}
  .car-card:hover{border-color:#c7cbe8;transform:translateY(-1px);}
  .car-card.sel{border-color:var(--brand);background:#f7f7ff;
      box-shadow:0 4px 14px rgba(91,91,214,.18);}
  .car-card .nm{font-size:14.5px;font-weight:700;}
  .car-card.sel .nm{color:var(--brand-2);}
  .car-card .al{font-size:11px;color:var(--sub);margin-top:2px;}
  .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;margin-top:7px;
      font-weight:600;letter-spacing:.3px;}
  .tag.hourly{background:#fff4e0;color:#b45309;}
  .tag.fixed{background:#e8f5ee;color:#15803d;}
  .tag.serial{background:#fde8ef;color:#be123c;}
  .car-card.sel::after{content:"";position:absolute;right:9px;top:9px;width:18px;height:18px;
      border-radius:50%;background:var(--brand);}
  .car-card.sel::before{content:"";position:absolute;right:14px;top:13px;width:5px;height:9px;
      border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);z-index:1;}

  /* 版本选择 */
  .ver-bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
      padding:10px;display:flex;gap:8px;overflow-x:auto;}
  .ver-bar::-webkit-scrollbar{display:none;}
  .ver-chip{flex:1;min-width:92px;padding:9px 6px;border:1.5px solid var(--line);border-radius:10px;
      background:#fff;cursor:pointer;font-size:12.5px;color:var(--txt);transition:.15s;text-align:center;}
  .ver-chip small{display:block;font-size:10px;color:var(--sub);margin-top:2px;}
  .ver-chip.on{border-color:var(--brand-2);background:linear-gradient(180deg,#f6f4ff,#ece8ff);
      color:var(--brand-2);font-weight:700;box-shadow:0 2px 8px rgba(124,58,237,.15);}
  .ver-chip .rec{display:none;}
  .ver-chip.on .rec{display:inline-block;font-size:9px;margin-left:3px;color:var(--accent);}

  /* 口令卡 */
  .result{margin-top:16px;display:none;}
  .result.show{display:block;animation:up .3s ease;}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pwd-card{border:1px solid var(--line);background:var(--card);border-radius:16px;
      padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(28,35,51,.05);}
  .pwd-head{display:flex;justify-content:space-between;align-items:center;}
  .pwd-head .tt{font-size:14px;font-weight:700;}
  .pwd-head .step-no{font-size:11px;color:#fff;background:var(--brand);border-radius:6px;padding:2px 8px;}
  .pwd-head .copy{font-size:12px;color:var(--brand);cursor:pointer;background:none;border:none;}
  .pwd-code{font-family:var(--mono);font-size:34px;font-weight:800;letter-spacing:6px;color:var(--txt);
      text-align:center;margin:14px 0 6px;font-variant-numeric:tabular-nums;}
  .pwd-card .hint{font-size:12px;color:var(--sub);text-align:center;
      background:#fafbff;border:1px dashed var(--line);border-radius:8px;padding:7px;margin-top:8px;}
  .pwd-card .hint b{color:var(--sub);font-weight:600;}
  .refresh-bar{margin-top:14px;text-align:center;color:var(--sub);font-size:12.5px;}
  .refresh-bar .time{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;}
  .steps-bar2{display:flex;justify-content:space-between;gap:6px;margin:8px 0 2px;}
  .cell{flex:1;height:4px;background:#e6e9f2;border-radius:2px;}
  .cell.lit{background:linear-gradient(90deg,var(--accent),#fb7185);}

  /* 隐藏“第 1 步内容体”以便聚焦步骤 2 时展示摘要 */
  .step-body-1.show{padding:10px;background:var(--card);border-radius:16px;border:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .step-body-1.show .grid-wrap{display:none;}
  .step-body-1 .edit{font-size:12px;color:var(--brand);border:1px solid var(--brand);
      border-radius:20px;padding:4px 12px;background:#fff;cursor:pointer;display:none;}
  .step-body-1.show .edit{display:block;}
  .step-body-1 #step1Grid{margin:0;}
  .selected-sum{font-size:13px;font-weight:700;color:var(--brand-2);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>车机口令速查</h1>
    <p>两步取口令 · 车型已分组 · 版本自动推荐</p>
  </header>

  <div class="steps"><div class="step-bar done" id="bar1"></div><div class="step-bar" id="bar2"></div></div>

  <!-- 第 1 步：车型 -->
  <div class="step-head"><b>STEP 1</b><h2>选择你的车型</h2><span id="carCount"></span></div>
  <div class="step-body-1" id="stepBody1">
    <div id="step1Grid" class="car-grid"></div>
  </div>

  <!-- 第 2 步：版本 + 口令 -->
  <div id="step2" style="display:none">
    <div class="step-head"><b>STEP 2</b><h2>确认系统版本</h2><span>不确定时保持推荐版本即可</span></div>
    <div class="ver-bar" id="verBar"></div>

    <div class="result" id="result">
      <div class="pwd-card" id="card1">
        <div class="pwd-head">
          <span class="step-no">工程模式</span>
          <span class="tt" id="pwd1Title">工程模式口令</span>
          <button class="copy" data-i="0">复制</button>
        </div>
        <div class="pwd-code" id="pwd1">······</div>
        <div class="hint" id="hint1"></div>
      </div>
      <div class="pwd-card" id="card2" style="display:none">
        <div class="pwd-head">
          <span class="step-no">ADB 权限</span>
          <span class="tt" id="pwd2Title">ADB权限口令</span>
          <button class="copy" data-i="1">复制</button>
        </div>
        <div class="pwd-code" id="pwd2">······</div>
        <div class="hint" id="hint2"></div>
      </div>
      <div class="refresh-bar">距离下次刷新 <span class="time" id="countdown">59:12</span></div>
      <div class="steps-bar2" id="tickCells"></div>
    </div>
  </div>
</div>

<script>
/* ====== 演示数据（示意稿：字段风格对齐 config/carModels.js，正式版由服务端下发） ====== */
const GROUPS = [
  { g:"纵横", list:["g700","zonghengF700"] },
  { g:"捷途", list:["traveler","ziyouzhe","shanhal7","shanhal9","x70plus","x90plus","x95","dasheng"] },
  { g:"奇瑞", list:["fengyunA9","hu8"] }
];
const MODELS = {
  g700:{ name:"纵横G700", type:"hourly", versions:[{v:"330335",n:"3.30-3.35"},{v:"335337",n:"3.36-3.37"},{v:"4.0x-4.4x",n:"4.0x-4.4x",rec:true}] },
  zonghengF700:{ name:"纵横F700", type:"hourly", versions:[{v:"000302",n:"00.03.02"}] },
  traveler:{ name:"旅行者 / 山海T2", type:"hourly", versions:[{v:"00x",n:"00.08 及以下",note:"需序列号"},{v:"0406",n:"4.06 及以下"},{v:"0407",n:"4.07 以上",rec:true},{v:"other",n:"其他"},{v:"cdm",n:"26款"}] },
  ziyouzhe:{ name:"自由者 / 山海T1", type:"hourly", versions:[{v:"11010x",n:"11.01.04 及以上",rec:true},{v:"01010x",n:"01.01.0x"},{v:"000402",n:"00.04.02"}] },
  shanhal7:{ name:"山海L7 / Plus / T9", type:"hourly", versions:[{v:"os10201",n:"OS1-02.01"},{v:"os1201000",n:"OS1_20.10.00",rec:true}] },
  shanhal9:{ name:"山海L9", type:"fixed", versions:[{v:"unknown",n:"其他版本"}] },
  x70plus:{ name:"X70 Plus / L / Pro / CDM", type:"fixed", versions:[{v:"unknown",n:"00.01.0x"}] },
  x90plus:{ name:"X90 / Plus / Pro / CDM", type:"fixed", versions:[{v:"040x",n:"04.0x"},{v:"unknown",n:"其他版本",rec:true}] },
  x95:{ name:"X95", type:"fixed", versions:[{v:"unknown",n:"其他版本"}] },
  dasheng:{ name:"捷途大圣", type:"fixed", versions:[{v:"fixed",n:"固定口令"}] },
  fengyunA9:{ name:"风云A9 / T9", type:"fixed", versions:[{v:"unknown",n:"其他版本"}] },
  hu8:{ name:"虎8 / 8L", type:"fixed", versions:[{v:"unknown",n:"其他版本"}] }
};
const TYPE_LABEL={hourly:["每小时更新","hourly"],fixed:["固定口令","fixed"],serial:["需序列号","serial"]};

let cur=null, curVer=null;

function renderGrid(){
  const grid=document.getElementById("step1Grid"); grid.innerHTML="";
  document.getElementById("carCount").textContent="共 "+Object.keys(MODELS).length+" 款";
  GROUPS.forEach(g=>{
    const tag=document.createElement("div"); tag.className="group-tag"; tag.textContent=g.g;
    grid.appendChild(tag);
    g.list.forEach(k=>{
      const m=MODELS[k];
      const card=document.createElement("div");
      card.className="car-card"+(cur===k?" sel":"");
      card.innerHTML=`<div class="nm">${m.name}</div><div class="al">${m.versions.map(x=>x.n).join(" · ")}</div>
        <span class="tag ${m.type}">${TYPE_LABEL[m.type][0]}</span>`;
      card.onclick=()=>{ chooseCar(k); };
      grid.appendChild(card);
    });
  });
}
function chooseCar(k){
  cur=k; curVer=null;
  // 重新展示完整网格（第2步由版本条提供），并让推荐版本优先
  const m=MODELS[k];
  const recIdx=m.versions.findIndex(x=>x.rec);
  curVer = recIdx>=0 ? m.versions[recIdx].v : m.versions[0].v;
  showStep2();
}
function showStep2(){
  document.getElementById("step2").style.display="block";
  document.getElementById("bar1").classList.add("done");
  document.getElementById("bar2").classList.add("on");
  renderVers(); renderResult(); window.scrollTo({top:0,behavior:"smooth"});
}
function renderVers(){
  const bar=document.getElementById("verBar"); bar.innerHTML="";
  MODELS[cur].versions.forEach(x=>{
    const chip=document.createElement("div");
    chip.className="ver-chip"+(x.v===curVer?" on":"");
    chip.innerHTML=`${x.n}${x.rec?"<span class=rec>推荐</span>":""}${x.note?`<small>${x.note}</small>`:""}`;
    chip.onclick=()=>{ curVer=x.v; renderVers(); renderResult(); };
    bar.appendChild(chip);
  });
}
/* 演示口令生成：仅用于视觉示意 */
function fakePwd(seed){ let s=""; const cs="0123456789"; for(let i=0;i<6;i++) s+=cs[(seed+i*7)%10]; return s; }
function renderResult(){
  const m=MODELS[cur];
  const vi=m.versions.findIndex(x=>x.v===curVer); const seed=(cur.length+curVer.length+vi*3)%10;
  const cards=[
    {title:"工程模式口令", hint:"进入途径：应用中心 → 蓝牙电话，输入上方口令", show:true, type:"car"},
    {title: m.name.includes("F700")||m.name.includes("G700") ? "ADB权限口令" : "加密项口令",
     hint:"进入途径：工程模式 → 加密设置，输入上方口令", show:m.type!=="fixed", type:"adb"}
  ];
  cards.forEach((c,i)=>{
    const card=document.getElementById("card"+(i+1));
    card.style.display=c.show?"block":"none";
    if(!c.show) return;
    document.getElementById("pwd"+(i+1)).textContent=fakePwd(seed+i*3);
    document.getElementById("hint"+(i+1)).innerHTML="<b>▶</b> "+c.hint;
    document.getElementById("pwd"+(i+1)).parentElement.querySelector(".tt").textContent=c.title;
  });
  document.getElementById("result").classList.add("show");
  if(m.type==="hourly"){ renderTicks(); startTick(); }
}
let timer;
function startTick(){
  clearInterval(timer);
  let left=59*60+12;
  timer=setInterval(()=>{
    left--;
    const mm=String(Math.floor(left/60)).padStart(2,"0"), ss=String(left%60).padStart(2,"0");
    document.getElementById("countdown").textContent=mm+":"+ss;
  },1000);
}
function renderTicks(){ const c=document.getElementById("tickCells"); c.innerHTML="";
  for(let i=0;i<60;i++){ const d=document.createElement("div"); d.className="cell"+(i>54?" lit":""); c.appendChild(d); } }
/* 复制 */
document.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{
  const el=document.getElementById(b.dataset.i==="0"?"pwd1":"pwd2");
  navigator.clipboard.writeText(el.textContent).then(()=>{ b.textContent="已复制"; setTimeout(()=>b.textContent="复制",1200); });
});
renderGrid();
</script>
</body>
</html>
