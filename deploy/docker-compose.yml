services:
  api:
    build: ./api
    image: jetour-api:1.0
    container_name: jetour-api
    restart: always
    environment:
      # 密钥来自同目录 .env，不写进镜像
      SIGNING_SECRET: "${SIGNING_SECRET:?请先在 deploy/.env 中设置 SIGNING_SECRET}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      TICKET_TTL_MS: "${TICKET_TTL_MS:-600000}"
      TICKET_BIND_IP: "${TICKET_BIND_IP:-0}"
      PORT: "8080"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      TZ: "Asia/Shanghai"
    volumes:
      - ./api/data:/app/data
    networks:
      - jetour-net

  web:
    build: ./web
    image: jetour-web:1.0
    container_name: jetour-web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - jetour-net
    depends_on:
      - api

networks:
  jetour-net:
    driver: bridge
