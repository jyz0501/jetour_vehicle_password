upstream jetour_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/png;

    # 静态资源走长缓存（首屏仍请求 index.html，保证更新及时）
    location ~* \.(png|jpg|jpeg|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 单页应用无需路由回退，缺失文件直接 404（避免 /admin.html 之类被回退成首页）
    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://jetour_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://jetour_api;
        proxy_set_header Host $host;
        access_log off;
    }
}
